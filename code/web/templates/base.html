<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}AstroManager{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar astro-glow">
      <div class="brand-block" data-tab="overview">
        <div class="brand-logo-shell brand-logo-shell--full astro-glow-soft">
          <img class="brand-logo brand-logo--full" src="/static/logo.jpg" alt="AstroManager Logo">
        </div>
        <div class="brand-copy brand-copy--stacked">
          <div class="brand-kicker">DeepSky Sessions</div>
          <p class="brand-subtitle brand-subtitle--headline">Telescope to Preview</p>
        </div>
      </div>

      <button class="topbar-menu-btn" id="open-menu-btn" aria-label="Menü öffnen" aria-controls="menu-sheet" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="app-content">
      {% block content %}{% endblock %}
    </main>

    {% include "includes/_menu.html" %}

    <nav class="bottom-nav astro-glow-soft" aria-label="Hauptnavigation">
      <button class="bottom-nav-btn active" data-tab="overview"><span>Start</span></button>
      <button class="bottom-nav-btn" data-tab="gallery"><span>Galerie</span></button>
      <button class="bottom-nav-btn" data-tab="status"><span>Status</span></button>
      <button class="bottom-nav-btn" data-tab="dev"><span>Dev</span></button>
      <button class="bottom-nav-btn" id="open-more-btn"><span>Mehr</span></button>
    </nav>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/progress.js"></script>
</body>
</html>
