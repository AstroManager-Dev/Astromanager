<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}AstroManager{% endblock %}</title>
  <meta name="theme-color" content="#041733">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AstroManager">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/pwa/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/pwa/icon-192.png">
  <link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  {% for css_file in css_module_files or [] %}
  <link rel="stylesheet" href="{{ url_for('static', filename=css_file) }}">
  {% endfor %}
</head>
<body>
  <div class="app-shell app-shell--new-layout">
    {% include "includes/_topbar_brand.html" %}

    <main class="app-content app-content--spacious">
      {% block content %}{% endblock %}
    </main>

    {% include "includes/_menu.html" %}

    <nav class="bottom-nav bottom-nav--edge astro-glow-soft" aria-label="Hauptnavigation">
      <button class="bottom-nav-btn active" data-tab="gallery"><span>Galerie</span></button>
      <button class="bottom-nav-btn" data-tab="atlas"><span>Atlas</span></button>
      <button class="bottom-nav-btn" data-tab="targets"><span>Targets</span></button>
      <button class="bottom-nav-btn" data-tab="overview"><span>Zentrale</span></button>
      <button class="bottom-nav-btn bottom-nav-btn--menu" id="open-menu-btn-bottom" aria-label="Menü öffnen" aria-controls="menu-sheet" aria-expanded="false"><span>Menü</span></button>
    </nav>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/progress.js"></script>
</body>
</html>
