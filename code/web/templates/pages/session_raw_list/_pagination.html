<section class="hud-info-shell raw-pagination-shell"><div class="raw-pagination-row">{% if session.raw_has_prev %}<a class="btn btn-secondary" href="{{ session.raw_list_base_href }}?source={{ session.raw_list_source }}&page={{ session.raw_prev_page }}&page_size={{ session.raw_page_size }}">Zurück</a>{% else %}<span class="btn btn-secondary raw-pagination-btn--disabled">Zurück</span>{% endif %}<span class="raw-pagination-label">Seite {{ session.raw_page }} / {{ session.raw_total_pages }}</span>{% if session.raw_has_next %}<a class="btn btn-secondary" href="{{ session.raw_list_base_href }}?source={{ session.raw_list_source }}&page={{ session.raw_next_page }}&page_size={{ session.raw_page_size }}">Weiter</a>{% else %}<span class="btn btn-secondary raw-pagination-btn--disabled">Weiter</span>{% endif %}</div></section>
