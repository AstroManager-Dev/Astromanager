<section class="hud-info-shell raw-controls-shell"><div class="raw-controls-row"><div><div class="eyebrow">Auswahl</div><div class="raw-controls-summary">{{ session.raw_total }} Dateien · Seite {{ session.raw_page }} / {{ session.raw_total_pages }}</div></div><div class="raw-page-size-switch">{% for size in session.raw_page_sizes %}<a class="raw-page-size-btn {% if size == session.raw_page_size %}active{% endif %}" href="{{ session.raw_list_base_href }}?source={{ session.raw_list_source }}&page=1&page_size={{ size }}">{{ size }}</a>{% endfor %}</div></div></section>
