<section class="hud-quick-actions hud-quick-actions--compact">
  <div class="hud-section-head hud-section-head--tight">
    <div>
      <div class="eyebrow">Zentrale</div>
      <h2>Aktionen</h2>
    </div>
  </div>
  <div class="hud-quick-actions__grid hud-quick-actions__grid--compact">
    <button class="btn hud-action-btn hud-action-btn--compact hud-action-btn--primary" data-action="raw_sync">
      <span class="hud-action-btn__kicker">Sync</span>
      <strong>RAW Sync</strong>
    </button>
    <button class="btn hud-action-btn hud-action-btn--compact hud-action-btn--primary" data-action="index_sessions">
      <span class="hud-action-btn__kicker">Index</span>
      <strong>Index Sessions</strong>
    </button>
    <button class="btn hud-action-btn hud-action-btn--compact" data-action="master_darks">
      <span class="hud-action-btn__kicker">Kalibrierung</span>
      <strong>Master Darks</strong>
    </button>
    <button class="btn hud-action-btn hud-action-btn--compact" data-action="siril_session">
      <span class="hud-action-btn__kicker">Siril</span>
      <strong>Siril Session</strong>
    </button>
    <button class="btn hud-action-btn hud-action-btn--compact" data-action="siril_group">
      <span class="hud-action-btn__kicker">Siril</span>
      <strong>Siril Group</strong>
    </button>
    <button class="btn hud-action-btn hud-action-btn--compact hud-action-btn--status" id="status-btn">
      <span class="hud-action-btn__kicker">System</span>
      <strong>Status ansehen</strong>
    </button>
  </div>
</section>
