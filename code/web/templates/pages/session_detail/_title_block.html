<div class="session-title-block">
  <div class="eyebrow">Session</div>
  <h1 class="session-title-block__title">{{ session.display_target_name }}</h1>
  <div class="session-title-block__date">{{ session.session_datetime_label }}</div>
  <div class="session-title-block__capture">{{ session.capture_meta_label }}</div>
  {% if session.display_target_aliases %}
    <div class="session-title-block__aliases">{{ session.display_target_aliases | join(' · ') }}</div>
  {% endif %}
</div>
