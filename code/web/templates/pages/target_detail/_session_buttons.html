{% for group in target.session_groups %}
<section class="hud-month-section">
  <div class="hud-month-section__head">
    <h3>{{ group.date }}</h3>
    <span>{{ group.session_items|length }}</span>
  </div>
  <div class="hud-session-list">
    {% for item in group.session_items %}
      {% include "pages/target_detail/_session_button.html" %}
    {% endfor %}
  </div>
</section>
{% else %}
<div class="hud-empty-card"><p class="muted">Keine Sessions für dieses Target gefunden.</p></div>
{% endfor %}
