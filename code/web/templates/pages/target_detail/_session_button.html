<a class="hud-session-row" href="/sessions/{{ item.id }}?back=target&target_id={{ target.id }}">
  <div class="hud-session-row__thumb">
    <img class="target-thumb" src="{{ item.dwarf_preview_url or '/static/img/nopic_session.svg' }}" alt="{{ item.session_button_label }}">
  </div>
  <div class="hud-session-row__text">
    <div class="hud-session-row__title">{{ item.session_button_label }}</div>
    <div class="hud-session-row__meta">EXP {{ item.exp_label or '—' }} · Gain {{ item.gain_label or '—' }} · Gesamt {{ item.total_exposure_label or '—' }}</div>
  </div>
  <div class="hud-session-row__chevron" aria-hidden="true">›</div>
</a>
