<section class="hud-target-card">
  <div class="hud-target-card__media">
    <img class="target-thumb" src="{{ target.thumb_url or '/static/img/nopic_session.svg' }}" alt="{{ target.display_name or 'Target' }}">
  </div>
  <div class="hud-target-card__content">
    <h2 class="hud-target-card__title">{{ target.display_name or 'Unbenanntes Target' }}</h2>
    <div class="hud-target-card__subtitle">{{ target.objtype or 'Target' }} · {{ target.session_count }} Sessions</div>
    <div class="hud-target-card__facts">
      <div class="hud-target-card__fact"><span>RA</span><strong>{{ target.final_ra_deg_fmt or '—' }}</strong></div>
      <div class="hud-target-card__fact"><span>DEC</span><strong>{{ target.final_dec_deg_fmt or '—' }}</strong></div>
      <div class="hud-target-card__fact"><span>Distanz</span><strong>{{ target.distance_label or '—' }}</strong></div>
    </div>
  </div>
</section>
