<details class="hud-collapse">
  <summary class="hud-collapse__summary">
    <span>Patch-Log</span>
    <span>{{ program_info["patch_count"] if program_info else 0 }} Einträge</span>
  </summary>
  <div class="hud-collapse__body">
    {% if program_info %}
      {% for entry in program_info["patch_log"] %}
        {% include "pages/program_info/_patch_log_entry.html" %}
      {% else %}
      <p class="muted">Keine Patch-Einträge vorhanden.</p>
      {% endfor %}
    {% endif %}
  </div>
</details>
