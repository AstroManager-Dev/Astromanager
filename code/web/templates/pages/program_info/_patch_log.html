<article class="card compact-card">
  <h3>Patch-Log</h3>
  <p class="muted">Laufende Änderungen aus <code>CHANGELOG.unreleased.md</code>.</p>
  <div class="info-changelog-list">
    {% for entry in program_info.patch_log %}
    <article class="info-changelog-entry">
      <div class="info-changelog-head">
        <strong>{{ entry.version or 'Patch' }}</strong>
        {% if entry.date %}<span class="muted">{{ entry.date }}</span>{% endif %}
      </div>
      <p class="muted">{{ entry.message }}</p>
    </article>
    {% else %}
    <p class="muted">Keine Patch-Einträge vorhanden.</p>
    {% endfor %}
  </div>
</article>
