<details class="hud-collapse">
  <summary class="hud-collapse__summary">
    <span>Minor-Log</span>
    <span>{{ program_info["minor_count"] if program_info else 0 }} Releases</span>
  </summary>
  <div class="hud-collapse__body">
    {% if program_info %}
      {% for release in program_info["minor_log"] %}
        {% include "pages/program_info/_minor_release_entry.html" %}
      {% else %}
      <p class="muted">Keine Minor-Releases vorhanden.</p>
      {% endfor %}
    {% endif %}
  </div>
</details>
