<article class="hud-log-entry">
  <div class="hud-log-entry__head">
    <strong>{{ release["version"] or 'Release' }}</strong>
    {% if release["date"] %}<span>{{ release["date"] }}</span>{% endif %}
  </div>
  <ul class="hud-log-entry__list">
    {% for item in release["items"] %}
    <li>{{ item }}</li>
    {% endfor %}
  </ul>
</article>
