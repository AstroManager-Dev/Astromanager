<section class="hud-info-shell raw-file-viewer-shell"><div class="raw-file-viewer-head"><div class="eyebrow">Ansicht</div><div class="raw-file-viewer-switch"><span class="raw-view-chip active">Datei</span><span class="raw-view-chip {% if raw_file.is_fits %}raw-view-chip--available{% endif %}">FITS</span></div></div>{% if raw_file.is_image_preview %}<img class="raw-file-image" src="{{ raw_file.media_url }}" alt="{{ raw_file.display_name }}">{% elif raw_file.is_fits %}<div class="raw-file-fits-dummy"><strong>FITS Viewer folgt als eigenes Modul.</strong><span>Datei kann bereits direkt heruntergeladen werden.</span></div>{% else %}<div class="raw-file-fits-dummy"><strong>Keine Browser-Vorschau verfügbar.</strong><span>Datei über Download öffnen.</span></div>{% endif %}</section>
