<section class="hud-info-shell raw-file-viewer-shell">
  {% if raw_file.viewer_type == 'fits' %}
    <div class="raw-file-view-stage">
      <button type="button" class="raw-file-preview-button" data-open-fullscreen data-viewer-kind="fits" data-image-url="{{ raw_file.viewer_fullscreen_url }}" aria-label="FITS-Vollbild öffnen">
        <img class="raw-file-image raw-file-image--fits" src="{{ raw_file.viewer_preview_url }}" alt="{{ raw_file.display_name }} FITS Preview" loading="eager">
      </button>
    </div>
    <details class="hud-info-shell raw-file-collapse raw-file-render-collapse">
      <summary>Render-Einstellungen</summary>
      <form class="raw-file-viewer-form" method="get" action="/raw-files/{{ raw_file.id }}" data-fits-preset-form>
        <input type="hidden" name="view" value="fits">
        <div class="raw-file-viewer-grid">
          <label class="raw-file-field raw-file-field--wide">
            <span>Preset</span>
            <select name="preset" data-fits-preset-select>
              {% for preset in raw_file.fits_preset_options %}
                <option
                  value="{{ preset.key }}"
                  data-debayer="{{ preset.debayer_mode }}"
                  data-stretch="{{ preset.stretch_mode }}"
                  data-black="{{ preset.black_value }}"
                  data-white="{{ preset.white_value }}"
                  data-gamma="{{ preset.gamma_value }}"
                  {% if preset.selected %}selected{% endif %}
                >
                  {{ preset.label }}{% if preset.key == 'auto' and preset.resolved_label %} → {{ preset.resolved_label }}{% endif %}
                </option>
              {% endfor %}
              {% if raw_file.selected_preset_key == 'custom' %}
                <option value="custom" selected>Custom</option>
              {% endif %}
            </select>
          </label>

          <label class="raw-file-field">
            <span>Debayer</span>
            <select name="debayer" data-fits-control="debayer">
              <option value="auto" {% if raw_file.debayer_mode == 'auto' %}selected{% endif %}>Auto Debayer</option>
              <option value="rggb" {% if raw_file.debayer_mode == 'rggb' %}selected{% endif %}>RGGB</option>
              <option value="bggr" {% if raw_file.debayer_mode == 'bggr' %}selected{% endif %}>BGGR</option>
              <option value="grbg" {% if raw_file.debayer_mode == 'grbg' %}selected{% endif %}>GRBG</option>
              <option value="gbrg" {% if raw_file.debayer_mode == 'gbrg' %}selected{% endif %}>GBRG</option>
              <option value="mono" {% if raw_file.debayer_mode == 'mono' %}selected{% endif %}>Mono</option>
            </select>
          </label>

          <label class="raw-file-field">
            <span>Stretch</span>
            <select name="stretch" data-fits-control="stretch">
              <option value="auto" {% if raw_file.stretch_mode == 'auto' %}selected{% endif %}>Auto Stretch</option>
              <option value="linear" {% if raw_file.stretch_mode == 'linear' %}selected{% endif %}>Linear</option>
              <option value="arcsinh" {% if raw_file.stretch_mode == 'arcsinh' %}selected{% endif %}>Arcsinh</option>
            </select>
          </label>

          <label class="raw-file-field raw-file-field--slider">
            <span>Black %</span>
            <input type="range" name="black" min="0" max="25" step="0.1" value="{{ raw_file.black_value }}" data-range-output="black-{{ raw_file.id }}" data-fits-control="black">
            <output id="black-{{ raw_file.id }}" class="raw-file-field__value">{{ raw_file.black_value }}</output>
          </label>

          <label class="raw-file-field raw-file-field--slider">
            <span>White %</span>
            <input type="range" name="white" min="75" max="100" step="0.1" value="{{ raw_file.white_value }}" data-range-output="white-{{ raw_file.id }}" data-fits-control="white">
            <output id="white-{{ raw_file.id }}" class="raw-file-field__value">{{ raw_file.white_value }}</output>
          </label>

          <label class="raw-file-field raw-file-field--slider">
            <span>Gamma</span>
            <input type="range" name="gamma" min="0.2" max="4" step="0.01" value="{{ raw_file.gamma_value }}" data-range-output="gamma-{{ raw_file.id }}" data-fits-control="gamma">
            <output id="gamma-{{ raw_file.id }}" class="raw-file-field__value">{{ raw_file.gamma_value }}</output>
          </label>

          <div class="raw-file-field raw-file-field--submit raw-file-field--wide">
            <button type="submit" class="astro-btn astro-btn--md astro-btn--primary">Vorschau aktualisieren</button>
          </div>
        </div>
      </form>
    </details>
  {% elif raw_file.viewer_type == 'image' %}
    <div class="raw-file-view-stage">
      <button type="button" class="raw-file-preview-button" data-open-fullscreen data-viewer-kind="image" data-image-url="{{ raw_file.viewer_fullscreen_url }}" aria-label="Bild-Vollbild öffnen">
        <img class="raw-file-image raw-file-image--raster" src="{{ raw_file.viewer_preview_url }}" alt="{{ raw_file.display_name }}" loading="eager">
      </button>
    </div>
  {% else %}
    <div class="raw-file-fits-dummy">
      <strong>Keine Browser-Vorschau verfügbar.</strong>
      <span>Datei über Download öffnen.</span>
    </div>
  {% endif %}

  <div class="raw-fullscreen-overlay" id="raw-fullscreen-overlay" hidden>
    <button type="button" class="raw-fullscreen-close" data-close-fullscreen aria-label="Vollbild schließen">×</button>
    <div class="raw-fullscreen-stage" id="raw-fullscreen-stage">
      <img class="raw-fullscreen-image" id="raw-fullscreen-image" alt="Vollbildansicht">
      <div class="raw-fullscreen-osd" id="raw-fullscreen-osd" hidden></div>
    </div>
  </div>
</section>
