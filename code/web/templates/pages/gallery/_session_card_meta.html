<div class="hud-session-row__text">
  <div class="hud-session-row__title">{{ item.session_datetime_label }}</div>
  <div class="hud-session-row__subtitle">{{ item.session_target_names_label }}</div>
  {% if item.exp_label or item.gain_label or item.total_exposure_label %}
  <div class="hud-session-row__meta">EXP {{ item.exp_label or '—' }} · Gain {{ item.gain_label or '—' }} · Gesamt {{ item.total_exposure_label or '—' }}</div>
  {% endif %}
</div>
<div class="hud-session-row__chevron" aria-hidden="true">›</div>
