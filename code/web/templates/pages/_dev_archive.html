<section class="tab-panel active" data-panel="dev-archive">
  <div class="card">
    <div class="section-title-row">
      <h2>Backup-Archiv</h2>
      <span class="muted">Alle Core-Backups mit Download und Restore</span>
    </div>
    <div class="file-card-grid" id="backup-archive-grid">
      {% for item in dev_assets.backups %}
      <article class="file-card">
        <strong>{{ item.name }}</strong>
        <div class="muted">{{ item.size_label }}</div>
        <div class="actions-grid actions-grid-compact" style="margin-top:10px">
          <a class="mini-btn file-download" href="/download/backup/{{ item.name|urlencode }}">Download</a>
          <button class="mini-btn" data-restore="{{ item.name }}">Wiederherstellen</button>
        </div>
      </article>
      {% else %}
      <article class="file-card empty">Keine Core-Backups gefunden.</article>
      {% endfor %}
    </div>
  </div>
</section>
