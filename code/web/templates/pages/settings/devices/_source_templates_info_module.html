<article class="hud-mini-card settings-device-module settings-device-module--compact settings-device-module--section">
  <div class="hud-section-head hud-section-head--tight">
    <div>
      <h4>Verfügbare Device-Sources</h4>
    </div>
  </div>
  {% if device_sources_settings %}
    <div class="settings-source-grid">
      {% for source in device_sources_settings %}
        <div class="settings-source-card{% if source.is_active %} is-active{% else %} is-inactive{% endif %}">
          <div class="settings-source-card__title">{{ source.vendor }} {{ source.model }}</div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p>Keine Source-Templates vorhanden.</p>
  {% endif %}
</article>
