name: compose
services:
  astromanager-ollama:
    container_name: astromanager-ollama
    environment:
      TZ: Europe/Berlin
    image: ollama/ollama:latest
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /opt/astro/cache/ollama
        target: /root/.ollama
        bind: {}
  astromanager-runner:
    build:
      context: /home/pi/docker/astromanager
      dockerfile: image/Dockerfile
    container_name: astromanager-runner
    environment:
      CACHE_ROOT: /cache
      CATALOG_ROOT: /data/catalog
      CONFIG_ROOT: /config
      CONTAINER_CACHE_ROOT: /cache
      CONTAINER_CONFIG_ROOT: /config
      CONTAINER_DATA_ROOT: /data
      CONTAINER_LOG_ROOT: /logs
      CONTAINER_RAW_ROOT: /raw
      CONTAINER_RUNTIME_ROOT: /runtime
      CONTAINER_TMP_ROOT: /tmp
      CONTAINER_WORK_ROOT: /work
      CORE_BACKUP_ROOT: /project-core/_dev_backups/core
      DATA_ROOT: /data
      DB_PATH: /runtime/pipeline.db
      EXPORT_ROOT: /data/export
      LOCK_DIR: /runtime/locks
      LOG_ROOT: /logs
      MASTERDARK_ROOT: /data/masterdarks
      OK_DIR: /runtime/ok
      PGID: "1000"
      PREVIEW_ROOT: /data/previews
      PROJECT_CORE_ROOT: /project-core
      PUID: "1000"
      QUEUE_DIR: /runtime/queue
      RAW_ROOT: /raw
      RUN_DIR: /runtime/run
      RUNTIME_ROOT: /runtime
      SQL_DUMP_ROOT: /project-core/_dev_backups/sql
      TMP_ROOT: /tmp
      TZ: Europe/Berlin
      WEB_PORT: "8088"
      WORK_ROOT: /work
    networks:
      default: null
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: /home/pi/docker/astromanager
        target: /project-core
        bind: {}
      - type: bind
        source: /hdd/hdd2/Dwarflab
        target: /raw
        bind: {}
      - type: bind
        source: /hdd/hdd2/astro/data
        target: /data
        bind: {}
      - type: bind
        source: /opt/astro/runtime
        target: /runtime
        bind: {}
      - type: bind
        source: /opt/astro/logs
        target: /logs
        bind: {}
      - type: bind
        source: /opt/astro/work
        target: /work
        bind: {}
      - type: bind
        source: /opt/astro/tmp
        target: /tmp
        bind: {}
      - type: bind
        source: /opt/astro/cache
        target: /cache
        bind: {}
      - type: bind
        source: /home/pi/docker/astromanager/config
        target: /config
        read_only: true
        bind: {}
    working_dir: /app
  astromanager-vlm:
    build:
      context: /home/pi/docker/astromanager
      dockerfile: image/Dockerfile
    command:
      - python3
      - /app/vlm/app.py
    container_name: astromanager-vlm
    depends_on:
      astromanager-ollama:
        condition: service_started
        required: true
    environment:
      CACHE_ROOT: /cache
      CONFIG_ROOT: /config
      CONTAINER_CACHE_ROOT: /cache
      CONTAINER_CONFIG_ROOT: /config
      CONTAINER_DATA_ROOT: /data
      CONTAINER_LOG_ROOT: /logs
      CONTAINER_RAW_ROOT: /raw
      CONTAINER_RUNTIME_ROOT: /runtime
      CONTAINER_TMP_ROOT: /tmp
      CONTAINER_WORK_ROOT: /work
      DATA_ROOT: /data
      DB_PATH: /runtime/pipeline.db
      LOG_ROOT: /logs
      OLLAMA_BASE_URL: http://astromanager-ollama:11434
      PGID: "1000"
      PUID: "1000"
      RAW_ROOT: /raw
      RUNTIME_ROOT: /runtime
      TMP_ROOT: /tmp
      TZ: Europe/Berlin
      VLM_BACKEND: ollama
      VLM_HOST: 0.0.0.0
      VLM_MODEL: qwen2.5-coder:7b
      VLM_PORT: "8091"
      VLM_TIMEOUT: "120"
      VLM_TRAIN_ROOT: /runtime/vlm
      VLM_VISION_MODEL: llava:7b
      WEB_PORT: "8088"
      WORK_ROOT: /work
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8091
        published: "8091"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/pi/docker/astromanager
        target: /project-core
        bind: {}
      - type: bind
        source: /hdd/hdd2/Dwarflab
        target: /raw
        bind: {}
      - type: bind
        source: /hdd/hdd2/astro/data
        target: /data
        bind: {}
      - type: bind
        source: /opt/astro/runtime
        target: /runtime
        bind: {}
      - type: bind
        source: /opt/astro/logs
        target: /logs
        bind: {}
      - type: bind
        source: /opt/astro/work
        target: /work
        bind: {}
      - type: bind
        source: /opt/astro/tmp
        target: /tmp
        bind: {}
      - type: bind
        source: /opt/astro/cache
        target: /cache
        bind: {}
      - type: bind
        source: /home/pi/docker/astromanager/config
        target: /config
        read_only: true
        bind: {}
    working_dir: /app
  astromanager-web:
    build:
      context: /home/pi/docker/astromanager
      dockerfile: image/Dockerfile
    command:
      - python3
      - /app/web/app.py
    container_name: astromanager-web
    environment:
      CACHE_ROOT: /cache
      CATALOG_ROOT: /data/catalog
      CONFIG_ROOT: /config
      CONTAINER_CACHE_ROOT: /cache
      CONTAINER_CONFIG_ROOT: /config
      CONTAINER_DATA_ROOT: /data
      CONTAINER_LOG_ROOT: /logs
      CONTAINER_RAW_ROOT: /raw
      CONTAINER_RUNTIME_ROOT: /runtime
      CONTAINER_TMP_ROOT: /tmp
      CONTAINER_WORK_ROOT: /work
      CORE_BACKUP_ROOT: /project-core/_dev_backups/core
      DATA_ROOT: /data
      DB_PATH: /runtime/pipeline.db
      EXPORT_ROOT: /data/export
      LOCK_DIR: /runtime/locks
      LOG_ROOT: /logs
      MASTERDARK_ROOT: /data/masterdarks
      OK_DIR: /runtime/ok
      PGID: "1000"
      PREVIEW_ROOT: /data/previews
      PROJECT_CORE_ROOT: /project-core
      PUID: "1000"
      QUEUE_DIR: /runtime/queue
      RAW_ROOT: /raw
      RUN_DIR: /runtime/run
      RUNTIME_ROOT: /runtime
      SQL_DUMP_ROOT: /project-core/_dev_backups/sql
      TMP_ROOT: /tmp
      TZ: Europe/Berlin
      WEB_PORT: "8088"
      WORK_ROOT: /work
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8088
        published: "8088"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/pi/docker/astromanager
        target: /project-core
        bind: {}
      - type: bind
        source: /hdd/hdd2/Dwarflab
        target: /raw
        bind: {}
      - type: bind
        source: /hdd/hdd2/astro/data
        target: /data
        bind: {}
      - type: bind
        source: /opt/astro/runtime
        target: /runtime
        bind: {}
      - type: bind
        source: /opt/astro/logs
        target: /logs
        bind: {}
      - type: bind
        source: /opt/astro/work
        target: /work
        bind: {}
      - type: bind
        source: /opt/astro/tmp
        target: /tmp
        bind: {}
      - type: bind
        source: /opt/astro/cache
        target: /cache
        bind: {}
      - type: bind
        source: /home/pi/docker/astromanager/config
        target: /config
        read_only: true
        bind: {}
    working_dir: /app
networks:
  default:
    name: compose_default
